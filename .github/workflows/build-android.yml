name: Build Karobaar Manager Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sw.js"
      - "native/**"
      - "icons/**"
      - "index.html"
      - "manifest.webmanifest"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Bundle app JavaScript
        run: npm run build:web

      - name: Prepare offline web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp sw.js www/
          cp -R src icons www/

      - name: Generate Android project
        run: npx cap add android

      - name: Install native direct-SMS bridge
        run: |
          mkdir -p android/app/src/main/java/pk/karobaar/manager
          cp native/android/DirectSmsPlugin.java android/app/src/main/java/pk/karobaar/manager/
          printf '%s\n' 'package pk.karobaar.manager;' 'import com.getcapacitor.BridgeActivity;' 'public class MainActivity extends BridgeActivity {' '  @Override public void onCreate(android.os.Bundle savedInstanceState) {' '    registerPlugin(DirectSmsPlugin.class);' '    super.onCreate(savedInstanceState);' '  }' '}' > android/app/src/main/java/pk/karobaar/manager/MainActivity.java
          sed -i 's#<application#<uses-permission android:name="android.permission.SEND_SMS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync offline app into Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            if ./gradlew --no-daemon --refresh-dependencies assembleDebug; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "Build failed; waiting 45 seconds before retry"; sleep 45; fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karobaar-manager-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
