<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c32">
  <meta name="description" content="Simple offline business, stock, sales and profit manager.">
  <title>Karobaar Manager</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="Karobaar Manager home"><span class="brand-mark">K</span><span><b>Karobaar</b><small>MANAGER</small></span></a>
      <div class="nav-label">WORKSPACE</div>
      <nav id="navigation">
        <button class="nav-item active" data-page="dashboard"><span>▦</span>Dashboard</button>
        <button class="nav-item" data-page="sales"><span>＋</span>New sale</button>
        <button class="nav-item" data-page="products"><span>▤</span>Products & stock</button>
        <button class="nav-item" data-page="customers"><span>♙</span>Customers</button>
        <button class="nav-item" data-page="purchases"><span>⇧</span>Purchases</button>
        <button class="nav-item" data-page="expenses"><span>−</span>Expenses</button>
        <button class="nav-item" data-page="reports"><span>▥</span>Reports</button>
      </nav>
      <div class="sidebar-bottom"><span class="offline-dot"></span><span>Offline data on this device</span></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div><div class="eyebrow" id="todayLabel"></div><h1 id="pageTitle">Dashboard</h1></div>
        <div class="top-actions"><span class="local-pill"><i></i> Saved on device</span><button class="avatar" title="Business profile">K</button></div>
      </header>
      <section class="page-content" id="pageContent" aria-live="polite"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="closeModal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
